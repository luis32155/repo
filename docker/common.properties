# Overrides appended only to the generated local Config Server repository.
server.ssl.enabled=false
security.require-ssl=false
spring.cloud.config.allowOverride=true
spring.cloud.config.overrideNone=true
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=
spring.r2dbc.pool.initial-size=0
spring.r2dbc.pool.max-size=4
spring.jmx.enabled=false
management.metrics.enable.all=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
security.truststore.path=/run/secrets/truststore.p12
security.truststore.password=${LOCAL_TRUSTSTORE_PASSWORD}
spring.param.public-key-without-session=file:/run/secrets/rsa_public_key_without_session.pem
spring.param.private-key-without-session=file:/run/secrets/rsa_private_key_without_session.pem
spring.param.public-key-with-session=file:/run/secrets/rsa_public_key_with_session.pem
spring.param.private-key-with-session=file:/run/secrets/rsa_private_key_with_session.pem
spring.param.public-key-frontend=file:/run/secrets/rsa_public_key_frontend.pem
spring.param.private-key-frontend=file:/run/secrets/rsa_private_key_frontend.pem
url.generate.token=http://ms-auth-token-generator:8086/bian/v1/party-authentication/initiate
url.validate.token.soap=http://ms-auth-token-validator:8087/bian/v1/party-authentication/validate-soap
auth.security.url=http://ms-authorizer:8088/bian/v1/transaction-authorization/security/execute
auth.actives.url=http://ms-authorizer:8088/bian/v1/transaction-authorization/actives/execute
auth.generic.url=http://ms-authorizer:8088/bian/v1/transaction-authorization/generic/execute
