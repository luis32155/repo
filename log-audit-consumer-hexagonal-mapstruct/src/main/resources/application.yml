spring:
  application:
    name: log-audit-consumer
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      datetime:
        adjust-dates-to-context-time-zone: false
        write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

audit:
  api:
    url: ${AUDIT_API_URL:http://localhost:8181/api/v1/audit/security/log}
    connect-timeout: ${AUDIT_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${AUDIT_API_READ_TIMEOUT:10s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
